[workspace]
resolver = "2"
members = [
    "crates/prismcast-core",
    "crates/prismcast-app",
    "crates/prismcast-media",
    "crates/prismcast-capture",
    "crates/prismcast-media-gst",
    "crates/prismcast-compositor",
    "crates/prismcast-audio",
    "crates/prismcast-output",
    "crates/prismcast-protocol",
    "crates/prismcast-remote",
    "crates/prismcast-web",
    "crates/prismcast-ui",
    "crates/prismcast-preview",
    "crates/prismcast-plugin-sdk",
    "crates/prismcast-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/worxbend/prismcast"

[workspace.dependencies]
# Internal crates
prismcast-core = { path = "crates/prismcast-core", version = "0.1.0" }
prismcast-app = { path = "crates/prismcast-app", version = "0.1.0" }
prismcast-media = { path = "crates/prismcast-media", version = "0.1.0" }
prismcast-compositor = { path = "crates/prismcast-compositor", version = "0.1.0" }
prismcast-audio = { path = "crates/prismcast-audio", version = "0.1.0" }
prismcast-output = { path = "crates/prismcast-output", version = "0.1.0" }
prismcast-protocol = { path = "crates/prismcast-protocol", version = "0.1.0" }
prismcast-remote = { path = "crates/prismcast-remote", version = "0.1.0" }
prismcast-web = { path = "crates/prismcast-web", version = "0.1.0" }
prismcast-ui = { path = "crates/prismcast-ui", version = "0.1.0" }
prismcast-plugin-sdk = { path = "crates/prismcast-plugin-sdk", version = "0.1.0" }

# Shared external stack
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
rmp-serde = "1"
clap = { version = "4", features = ["derive", "env"] }
# rustls with the pure-Rust ring provider: default-features off so the
# aws-lc-rs C build (rustls 0.23's default provider) never enters the tree
# (ADR-0022).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-pki-types = { version = "1.9", features = ["std"] }
rustls-native-certs = "0.8"

# Native backend; GLib 0.22 matches gtk4 0.11.
gstreamer = { version = "0.25", features = ["v1_26"] }
