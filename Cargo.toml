[workspace]
resolver = "2"
members = [
    "crates/prismcast-core",
    "crates/prismcast-media",
    "crates/prismcast-compositor",
    "crates/prismcast-audio",
    "crates/prismcast-output",
    "crates/prismcast-protocol",
    "crates/prismcast-remote",
    "crates/prismcast-web",
    "crates/prismcast-ui",
    "crates/prismcast-plugin-sdk",
    "crates/prismcast-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/worxbend/prismcast"

[workspace.dependencies]
# Internal crates
prismcast-core = { path = "crates/prismcast-core", version = "0.1.0" }
prismcast-media = { path = "crates/prismcast-media", version = "0.1.0" }
prismcast-compositor = { path = "crates/prismcast-compositor", version = "0.1.0" }
prismcast-audio = { path = "crates/prismcast-audio", version = "0.1.0" }
prismcast-output = { path = "crates/prismcast-output", version = "0.1.0" }
prismcast-protocol = { path = "crates/prismcast-protocol", version = "0.1.0" }
prismcast-remote = { path = "crates/prismcast-remote", version = "0.1.0" }
prismcast-web = { path = "crates/prismcast-web", version = "0.1.0" }
prismcast-ui = { path = "crates/prismcast-ui", version = "0.1.0" }
prismcast-plugin-sdk = { path = "crates/prismcast-plugin-sdk", version = "0.1.0" }

# Shared external stack
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
