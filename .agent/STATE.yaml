open_questions:
- Integrated live window preview: picker grants landed but selected windows were not the fixture (white/dark/black composites, constant 6144x3456); raw consumer diagnostic test armed, awaiting a coordinated selection retry
- KDE/X11 capture and monitor validation remain unverified
- Camera device paths renumber across replug; sysfs/serial-stable identity is a follow-up (persisted path is advisory, missing device is recoverable)
- GstDeviceMonitor v4l2 provider is hidden by PipeWire on target desktops; show-all-devices workaround in place, PipeWire camera sources deferred
- Wire-exposed camera device listing needs a protocol schema change (CAPTURE-003 follow-up)
- Camera USB link flapped during validation (nodes vanished/re-enumerated); busy/unplug mapping implemented, live unplug UX untested
- Canonical Undo/Redo Commands and protocol/UI integration remain follow-up work
- Destructive Add/Remove undo and persisted history are not implemented
- Z-order boundary overflow and missing neighbor update events need coordinated core fixes
- Atomic expected-version editing command needed to close snapshot-read to dispatch race (UI-002)
- Negotiated dimensions now support portal capture; other source kinds need their own runtime contracts
- gst-plugins-rs vendoring: isobmff/wpe2/gopbuffer not distro-packaged (RES-003)
- Browser source audio gap in wpe2 (RES-006) — revisit at Phase 11
- Group domain type missing for PLAN §8 Group/Ungroup (ARCH-003 follow-up)
- Scene-nesting cycle check for SourceKind::Scene in apply() (ARCH-003 follow-up)
- Wire StateSnapshot lacks revision field (IPC-001 follow-up, protocol schema change)
- Broadcaster unsubscribe API missing (IPC-001 workaround: server-wide fanout)
- SystemEvent::PersistenceRecovered core variant needed (CORE-004 follow-up)
- SaveProject command missing from core Command enum (CORE-004 follow-up)
- Encoder/service registries have no domain home; profiles save empty lists (CORE-004)
- Broadcaster unsubscribe API missing; server-wide fanout workaround remains (IPC-001/WS-002)
- Meter event producer absent (media/audio layer); throttling machinery exists but is unexercised against real load
- TLS wss:// and non-loopback bind deferred to WS-003; msgpack subprotocol reserved but unimplemented
- obs-websocket adapter MVP shipped (OBSWS-001); OBSWS-002+ defers MessagePack, SerialFrame/Parallel batches, meters, filters, screenshots, stats, vendor/persistent data, media control, virtualcam/replay
- GetVersion reports crate version as obsVersion; obws's default studio-version gate needs skip_studio_version_check — consider OBS-shaped version advertisement in OBSWS-002
