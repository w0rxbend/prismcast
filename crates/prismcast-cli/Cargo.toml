[package]
name = "prismcast-cli"
description = "studioctl-style command-line controller (binary: prismcast-cli)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
prismcast-protocol.workspace = true
prismcast-remote.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# rustls-tls-native-roots unlocks Connector::Rustls for the wss:// arm of
# prismcast-remote's WsClient (features unify with prismcast-remote's main
# dependency above). Without it prismcast-remote does not compile outside a
# dev-feature-unified workspace build.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
uuid.workspace = true

[dev-dependencies]
prismcast-app.workspace = true
rcgen = "0.13"
